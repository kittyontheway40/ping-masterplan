<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนงานโครงการลุ่มน้ำปิง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<!--CSS-->
<link rel="stylesheet" href="assets/leaflet.css?v=27">
<link rel="stylesheet" href="assets/style.css?v=27">
<!--/CSS-->
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brand-row">
        <img class="brand-logo" src="assets/logos-onwr-chula.png" alt="สำนักงานทรัพยากรน้ำแห่งชาติ และศูนย์บริการวิชาการแห่งจุฬาลงกรณ์มหาวิทยาลัย" width="338" height="160">
        <h1>ระบบติดตามแผนงานโครงการแผนแม่บททรัพยากรน้ำ <b>ลุ่มน้ำปิง</b></h1>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="authBtn">เข้าสู่ระบบผู้ดูแล</button>
      <button class="btn pink" id="newBtn">+ เสนอโครงการ</button>
    </div>
    <span id="mode" class="mode ver"></span>
    <p class="proj">โครงการศึกษาจัดทำแผนแม่บทการบริหารจัดการทรัพยากรน้ำในเขตลุ่มน้ำปิง <span class="nw">ปรับปรุงช่วงที่ 1 (พ.ศ.&nbsp;2566-2580)</span></p>
  </div>
</header>
<main class="wrap">
  <div class="kpis" id="kpis" aria-label="สรุปภาพรวม"></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="area" aria-selected="true">โครงการรายจังหวัด อำเภอ ตำบล</button>
    <button class="tab" role="tab" data-tab="basin" aria-selected="false">โครงการรายลุ่มน้ำสาขา</button>
    <button class="tab" role="tab" data-tab="map" aria-selected="false">แผนที่</button>
    <button class="tab" role="tab" data-tab="admin" aria-selected="false">ผู้ดูแลระบบ</button>
  </nav>
  <section class="filters" id="filters" aria-label="ตัวกรอง"></section>
  <section class="view" id="view"><div class="empty">กำลังโหลดข้อมูล…</div></section>
</main>
<footer class="footer"><div class="wrap foot-in">
  <p class="src" title="ตารางแผนงาน ยุทธศาสตร์ ตัวชี้วัด โครงการ (ชีต 1–6) · ขอบเขตตำบลตามพระราชกฤษฎีกากำหนดลุ่มน้ำ · ชั้นข้อมูลลุ่มน้ำสาขา ลำน้ำ และแบบจำลองความสูงเชิงเลข (DEM)">ที่มาข้อมูล: แผนแม่บทลุ่มน้ำปิง (ชีต 1–6) · พระราชกฤษฎีกากำหนดลุ่มน้ำ · ชั้นข้อมูลลุ่มน้ำสาขา ลำน้ำ และ DEM</p>
  <div class="credit">
    <span class="credit-l">จัดทำโดย</span>
    <img class="credit-logo" src="assets/chula-unisearch.png" alt="ศูนย์บริการวิชาการแห่งจุฬาลงกรณ์มหาวิทยาลัย (Chula Unisearch) จุฬาลงกรณ์มหาวิทยาลัย" width="900" height="120">
  </div>
</div></footer>
<!--JS-->
<script src="config.js?v=27"></script>
<!--/JS-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<!--APP-->
<script src="assets/app.js?v=27"></script>
<!--/APP-->
</body>
</html>
